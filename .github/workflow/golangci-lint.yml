name: golangci-lint
on:
  pull_request:
    branches: ["main"]

permissions:
  content: read

jobs:
  golangci-lint:
  name: lint
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: "1.26.5"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12
